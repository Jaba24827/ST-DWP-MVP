
name: SL-DWP Playwright Tests

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sldwp_e2e
          MYSQL_USER: sldwp_app
          MYSQL_PASSWORD: Admin123!!!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env.testing
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env.testing
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=sldwp_e2e/' .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=sldwp_app/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=Admin123!!!/' .env.testing
          php artisan key:generate --env=testing
          php artisan config:clear --env=testing

      - name: Create PHPUnit database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS sldwp;
            GRANT ALL PRIVILEGES ON sldwp.* TO 'sldwp_app'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run PHPUnit integration tests
        run: php artisan test --testsuite=Feature
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sldwp
          DB_USERNAME: sldwp_app
          DB_PASSWORD: ${{ secrets.PHPUNIT_DB_PASSWORD }}
          SESSION_DRIVER: array
          CACHE_STORE: array
          MAIL_MAILER: log

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npx playwright test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sldwp_e2e
          DB_USERNAME: sldwp_app
          DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
          SESSION_DRIVER: array
          CACHE_STORE: array
          MAIL_MAILER: log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
